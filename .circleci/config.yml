version: 2.1

orbs:
  node: circleci/node@7.2.0

parameters:
  vercel_cli_version:
    type: string
    default: "53.0.1"

executors:
  node_24:
    docker:
      - image: cimg/node:24.14.1
    working_directory: ~/project

  playwright_browser:
    docker:
      - image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_directory: ~/project

commands:
  setup_pnpm:
    steps:
      - run:
          name: Check Corepack
          command: corepack --version

  restore_project:
    steps:
      - attach_workspace:
          at: ~/project
      - setup_pnpm

  require_vercel_environment:
    steps:
      - run:
          name: Check Vercel environment variables
          command: |
            missing=0

            for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
              if [ -z "${!name:-}" ]; then
                echo "Missing required environment variable: ${name}"
                missing=1
              fi
            done

            exit "${missing}"

  require_vercel_automation_bypass:
    steps:
      - run:
          name: Check Vercel automation bypass secret
          command: |
            trimmed_secret="$(printf "%s" "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" | tr -d '[:space:]')"

            if [ -z "${trimmed_secret}" ]; then
              echo "Missing required environment variable: VERCEL_AUTOMATION_BYPASS_SECRET"
              echo "Create a Vercel Protection Bypass for Automation secret and add it to CircleCI for deployed e2e tests."
              exit 1
            fi

jobs:
  install_dependencies:
    executor: node_24
    steps:
      - checkout
      - setup_pnpm
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run:
          name: Install dependencies
          command: corepack pnpm install --frozen-lockfile --store-dir .pnpm-store
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - .pnpm-store
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  lint:
    executor: node_24
    steps:
      - restore_project
      - run: corepack pnpm run lint

  typecheck:
    executor: node_24
    steps:
      - restore_project
      - run: corepack pnpm run typecheck

  unit_tests:
    executor: node_24
    steps:
      - restore_project
      - run: corepack pnpm run test

  build:
    executor: node_24
    steps:
      - restore_project
      - run: corepack pnpm run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - .next

  e2e_fixture_gate:
    executor: playwright_browser
    parallelism: 5
    steps:
      - restore_project
      - run:
          name: Install Node dependencies
          command: |
            corepack pnpm install --frozen-lockfile --store-dir .pnpm-store
      - run:
          name: Install Google Chrome for Playwright
          command: corepack pnpm exec playwright install chrome
      - run:
          name: Run bag-analysis Playwright fixture gate
          command: |
            set -euo pipefail
            mkdir -p test-results
            node scripts/run-circleci-bag-analysis-fixtures.mjs --list | circleci tests run \
              --split-by=timings \
              --timings-type=name \
              --command="node scripts/run-circleci-bag-analysis-fixtures.mjs"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: playwright-report
          destination: playwright-report
      - store_artifacts:
          path: test-results
          destination: test-results

  deploy_preview:
    executor: node_24
    steps:
      - restore_project
      - require_vercel_environment
      - run:
          name: Deploy preview to Vercel
          command: |
            set -euo pipefail
            export VERCEL_CLI_VERSION="<< pipeline.parameters.vercel_cli_version >>"
            export NO_UPDATE_NOTIFIER=1
            export VERCEL_TELEMETRY_DISABLED=1
            deploy_output="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --token "${VERCEL_TOKEN}")"
            deployment_url="$(printf "%s\n" "${deploy_output}" | grep -Eo 'https://[^[:space:]]+' | tail -n 1 || true)"

            if [ -z "${deployment_url}" ]; then
              echo "Failed to parse deployment URL from 'vercel deploy' output" >&2
              printf "%s\n" "${deploy_output}" >&2
              exit 1
            fi

            printf "%s\n" "${deployment_url}" > vercel-deployment-url
            echo "Deployed to ${deployment_url}"
      - persist_to_workspace:
          root: ~/project
          paths:
            - vercel-deployment-url

  deploy_production:
    executor: node_24
    steps:
      - restore_project
      - require_vercel_environment
      - run:
          name: Deploy production to Vercel
          command: |
            set -euo pipefail
            export VERCEL_CLI_VERSION="<< pipeline.parameters.vercel_cli_version >>"
            export NO_UPDATE_NOTIFIER=1
            export VERCEL_TELEMETRY_DISABLED=1
            deploy_output="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --token "${VERCEL_TOKEN}")"
            deployment_url="$(printf "%s\n" "${deploy_output}" | grep -Eo 'https://[^[:space:]]+' | tail -n 1 || true)"

            if [ -z "${deployment_url}" ]; then
              echo "Failed to parse deployment URL from 'vercel deploy' output" >&2
              printf "%s\n" "${deploy_output}" >&2
              exit 1
            fi

            printf "%s\n" "${deployment_url}" > vercel-deployment-url
            echo "Deployed to ${deployment_url}"
      - persist_to_workspace:
          root: ~/project
          paths:
            - vercel-deployment-url

  deployed_playwright:
    executor: playwright_browser
    parallelism: 5
    steps:
      - restore_project
      - require_vercel_automation_bypass
      - run:
          name: Install Node dependencies
          command: |
            corepack pnpm install --frozen-lockfile --store-dir .pnpm-store
      - run:
          name: Install Google Chrome for Playwright
          command: corepack pnpm exec playwright install chrome
      - run:
          name: Run deployed Playwright validation
          command: |
            set -euo pipefail
            export PLAYWRIGHT_BASE_URL="$(tail -n 1 vercel-deployment-url)"
            export VERCEL_AUTOMATION_BYPASS_SECRET="${VERCEL_AUTOMATION_BYPASS_SECRET}"
            mkdir -p test-results
            node scripts/run-circleci-bag-analysis-fixtures.mjs --list | circleci tests run \
              --split-by=timings \
              --timings-type=name \
              --command="node scripts/run-circleci-bag-analysis-fixtures.mjs"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: playwright-report
          destination: playwright-report
      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  verify_and_deploy:
    jobs:
      - install_dependencies
      - lint:
          requires:
            - install_dependencies
      - typecheck:
          requires:
            - install_dependencies
      - unit_tests:
          requires:
            - install_dependencies
      - build:
          requires:
            - lint
            - typecheck
            - unit_tests
      - e2e_fixture_gate:
          requires:
            - build
      - deploy_preview:
          requires:
            - e2e_fixture_gate
          filters:
            branches:
              ignore: main
      - deployed_playwright:
          name: deployed_preview_playwright
          requires:
            - deploy_preview
          filters:
            branches:
              ignore: main
      - deploy_production:
          requires:
            - e2e_fixture_gate
          filters:
            branches:
              only: main
      - deployed_playwright:
          name: deployed_production_playwright
          requires:
            - deploy_production
          filters:
            branches:
              only: main
